# Burst test for per-batch signing keys: compares how relays treat a burst of
# events from one stable key with a burst where every event has a brand-new key.
# Runs on push when the script changes, or manually.
name: Relay burst test
on:
  push:
    paths: [scripts/relay-burst.mjs, .github/workflows/relay-burst.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  burst:
    runs-on: ubuntu-latest
    # Two runners (usually two IPs), so a per-IP quota can't hide which mode a relay dislikes.
    strategy:
      fail-fast: false
      matrix:
        order: ['stable,fresh,fresh,stable', 'fresh,stable,stable,fresh']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Burst test
        run: |
          ORDER='${{ matrix.order }}' node scripts/relay-burst.mjs > table.md
          cat table.md
          cat table.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relay-burst-${{ strategy.job-index }}
          path: relay-burst.json
          retention-days: 30
